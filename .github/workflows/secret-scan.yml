name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we scan every commit the PR/push introduces,
          # not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          gitleaks git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --no-banner --redact --verbose \
            --log-opts "${base}..${head}"

      # Full history, minus the fingerprints baselined in .gitleaksignore
      # (secrets already committed before this guard existed — see that file).
      # Any NEW secret anywhere in history still fails this job.
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --no-banner --redact --verbose
